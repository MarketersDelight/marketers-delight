name: Build Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and attach theme zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build clean theme directory
        run: |
          mkdir -p build/marketers-delight
          rsync -av \
            --exclude-from=.distignore \
            --exclude='build' \
            ./ build/marketers-delight/

      - name: Reset theme.json to empty object
        run: echo '{}' > build/marketers-delight/theme.json

      - name: Remove stray system files
        run: find build -name '.DS_Store' -delete

      - name: Create zip
        run: |
          cd build
          zip -r marketers-delight.zip marketers-delight

      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: build/marketers-delight.zip
          generate_release_notes: true
